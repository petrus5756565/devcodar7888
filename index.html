<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Home</title> 
    <link rel="stylesheet" href="../../style.css">
</head>
<body>

    <!-- O topo com o logo separado dos itens -->
    <header class="header-home">
        <img src="seu-logo.png" class="logo-home" alt="Logo">
    </header>

    <!-- O contêiner com os seus cards de conteúdo -->
    <main class="wrapper-itens">
        <div class="card-item">
            <div class="card-topo">Imagem/Título</div>
            <div class="card-corpo">Item 1</div>
        </div>
        <div class="card-item">
            <div class="card-topo">Imagem/Título</div>
            <div class="card-corpo">Item 2</div>
        </div>
        <div class="card-item">
            <div class="card-topo">Imagem/Título</div>
            <div class="card-corpo">Item 3</div>
        </div>
    </main>

</body>
</html>
